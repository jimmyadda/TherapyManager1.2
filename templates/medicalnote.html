<style>
    .editor-toolbar {
        position: relative;
        top:45px;
        background-color: #f4f4f4;
        border-bottom: 1px solid #ccc;
        padding: 5px;
    }

    .editor-button {
        padding: 5px 10px;
        margin-right: 5px;
        cursor: pointer;
        border: none;
        background-color: transparent;
    }

    .editor-button:hover {
        background-color: #ddd;
    }

    #editor {
        position: relative;
        width: 99%;
        height: 700px;
        top: 50px;
        border: 1px solid #ccc;
        padding: 10px;
        font-family: Arial, sans-serif;
        overflow-y: auto;
        resize: both;overflow: auto;
    }
.HE 
{
  float: none;
  text-align: right;
}

<body>


    <div class="form-group">
        <label class="col-lg-2 control-label">Patient</label>
        <div class="col-lg-10">
           <select disabled="true" required id="patient_select" type="text" name="pat_id" class="form-control" placeholder="Please select Patient"></select>
        </div>
     </div>

<div class="editor-toolbar" >
    <h4 key="medrech4" class="translate EN" >Update patient medical record</h4>
    <button class="editor-button" onclick="execCommand('bold')"><b>B</b></button>
    <button class="editor-button" onclick="execCommand('italic')"><i>I</i></button>
    <button class="editor-button" onclick="execCommand('underline')"><u>U</u></button>
    <button class="editor-button" onclick="execCommand('insertOrderedList')">&#35;</button>
    <button class="editor-button" onclick="execCommand('insertUnorderedList')">&#8226;</button>
    <button class="editor-button" onclick="execCommand('justifyLeft')"><img src="https://image.flaticon.com/icons/svg/60/60791.svg" alt="Left Align" width="16" height="16"></button>
    <button class="editor-button" onclick="execCommand('justifyCenter')"><img src="https://image.flaticon.com/icons/svg/60/60795.svg" alt="Center Align" width="16" height="16"></button>
    <button class="editor-button" onclick="execCommand('justifyRight')"><img src="https://image.flaticon.com/icons/svg/60/60792.svg" alt="Right Align" width="16" height="16"></button>

    <input id="foreColor" type="color">
    <input id="hiliteColor" type="color">

    <select id="fontname" class="editor-button">
        <option selected disabled>Font</option>
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Helvetica">Helvetica</option>
        <option value="Times New Roman">Times New Roman</option>
    </select>
    <select id="fontsize" class="editor-button">
        <option selected disabled>Size</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
    </select>
    <br>
<h4 key="newtypetitle" class="translate EN">Record Types</h4>
<input class="translate EN" type="text" id="newTypeName" placeholder="New Type Name">
<button key="addtype" class="translate EN" id="addType" >Add Type</button>
<br>
    <select class="translate EN" id="appointmentType">
    </select>
    <span> &nbsp;&nbsp;</span>
    <button  key="saveTemplate" id="saveTemplate" class="translate EN">Save Template</button>
<button key="LoadTemplate"  id="loadTemplate" class="translate EN">Load Template</button>
</div>

{% if session['textineditor'] %}
<div id="texttoedit" style="display: none;"> {{session['textineditor']}} </div>
<div id="editor" contenteditable="true"></div>
{% else %}
<div id="editor" contenteditable="true"></div>
{% endif %}
<br>
<br>
<button style="margin-top: 20px;" id="savethepatient" type="button" class="btn btn-primary" onclick="saveText()" >Save changes</button>




<script>

   //select changes
   const selectsize = $("#fontsize");
   const selectname = $("#fontname");
   const selectforecolor = $("#foreColor");
   const selecthiliteColor = $("#hiliteColor");

   selectsize.on('change', function() {
    execCommand('fontSize', this.value);
    });

    selectname.on('change', function() {
        execCommand('fontname', this.value);
    });
    selectforecolor.on('change', function() {
    execCommand('foreColor', this.value);
    });
    selecthiliteColor.on('change', function() {
    execCommand('hiliteColor', this.value);
    });
   ////////////////////////////////////////////


    function execCommand(command, value = null) {        
        document.execCommand(command, false, value);
    }


    function saveText() {
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id')
    const noteid = urlParams.get('noteid')
    var content = document.getElementById('editor').innerHTML;
    let f = new FormData();
    if (noteid > 0){
    f.append("noteid",noteid)
    }
    f.append("pat_id",id)
    f.append("content",JSON.stringify({content}));
    fetch("/medicalnote",{
    "method": "POST",
    "body":f,       
    }).then(response => response.text()).then(data => {
                                //Get LAng
                                var my_lang = sessionStorage.getItem("lang");
                        if(my_lang=="HE"){
                        $.notify("רשומה התווספה בהצלחה", {"status":"success"}); 
                        }
                        else{
                            $.notify("Medical Note Added Successfully", {"status":"success"});
                        } 
    }).catch(error => {
        console.error('Error:', error);
        alert('Failed to save text');
    });
   }
   

  function getPatient(id) {
    var patientSelect="";
        var settings = {
            "async": true,
            "crossDomain": true,
            "url": "patientapi/"+id,
            "method": "GET",
            "headers": {
                "cache-control": "no-cache"
            }
        }

        $.ajax(settings).done(function (response) {
            response.pat_fullname = response.pat_first_name+" "+response.pat_last_name
            patientSelect +="<option value="+response.pat_id+">"+response.pat_fullname+"</option>";

        $("#patient_select").html(patientSelect);

        });

            //$("#patient_select").html(patientSelect)
        }

   $(document).ready(function () {
    var texttoedit = document.getElementById("texttoedit").textContent 
    if(texttoedit){ $("#editor").html(texttoedit); }

    const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const id = urlParams.get('id')
        //patient select    
         getPatient(id);   
         
         


    //tamplates
    document.getElementById('loadTemplate').addEventListener('click', async () => {
        const sel = document.getElementById('appointmentType');
        const appointmentType = sel.options[sel.selectedIndex].text;
        const response = await fetch(`/api/templates/${appointmentType}`);
        
        if (response.ok) {
            const data = await response.json();
            document.getElementById('editor').innerHTML = data.template_text[0].tamplate || '';
            console.log(data.template_text[0].tamplate);
        } else {
            alert('Template not found');
        }
      
        //call 
       //language    
       if(my_lang=="HE"){
       translate_DOM_element('translate',Translate_jsonData,'EN',my_lang);     
       }
       else{
       translate_DOM_element('translate',Translate_jsonData,'HE',my_lang);  
       }  

    });

document.getElementById('saveTemplate').addEventListener('click', async () => {
        const sel = document.getElementById('appointmentType');
        const appointmentType = sel.options[sel.selectedIndex].text;
        const templateText = document.getElementById('editor').innerHTML;

        const response = await fetch('/api/templates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ appointment_type: appointmentType, template_text: templateText })
        });

        const result = await response.json();
        alert(result.message || 'Error saving template');
    });

        // Fetch templates and populate dropdown
            async function fetchTemplates() {
            let response = await fetch('/templates');
            var templates = await response.json();
            templates = templates.templates
            console.log(templates);
            let select = document.getElementById('appointmentType');
            templates.forEach(template => {
                let option = document.createElement('option');
                option.classList = "translate EN";
                option.value = template.rec_id;
                option.textContent = template.appointment_type;
                select.appendChild(option);
            });
        }

            // Add a new type
            document.getElementById('addType').addEventListener('click', async () =>  {
                let typeName = document.getElementById('newTypeName').value;
                if (!typeName) {
                    alert('Type name cannot be empty');
                    return;
                }
                let response = await fetch('/Addappointment_type', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: typeName })
                });
                if (response.ok) {
                    document.getElementById('newTypeName').value = ''; // Clear input
                    removeOptions(document.getElementById('appointmentType'))
                    fetchTemplates();
                } else {
                    let error = await response.json();
                    alert(error.error);
                }
            });

        fetchTemplates();
    });

    function removeOptions(selectElement) {
        var i, L = selectElement.options.length - 1;
        for(i = L; i >= 0; i--) {
            selectElement.remove(i);
        }
    }

</script>


<script>
    window.onunload = refreshParent;
    function refreshParent() {
        window.opener.location.reload();
        window.close();
    }
</script>
