<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
   <!-- =============== VENDOR STYLES ===============-->
   <!-- FONT AWESOME-->
   <link rel="stylesheet" href="../static/vendor/fontawesome/css/font-awesome.min.css">
   <!-- SIMPLE LINE ICONS-->
   <link rel="stylesheet" href="../static/vendor/simple-line-icons/css/simple-line-icons.css">
   <!-- ANIMATE.CSS-->
   <link rel="stylesheet" href="../static/vendor/animate.css/animate.min.css">
   <!-- WHIRL (spinners)-->
   <link rel="stylesheet" href="../static/vendor/whirl/dist/whirl.css">
    <link rel="stylesheet" href="../static/vendor/sweetalert/dist/sweetalert.css">
     <!-- DATATABLES-->
   <link rel="stylesheet" href="../static/vendor/datatables-colvis/css/dataTables.colVis.css">
   <link rel="stylesheet" href="../static/vendor/datatables/media/css/dataTables.bootstrap.css">
   <link rel="stylesheet" href="../static/vendor/dataTables.fontAwesome/index.css">
   <!-- =============== PAGE VENDOR STYLES ===============-->
   <!-- =============== BOOTSTRAP STYLES ===============-->
   <link rel="stylesheet" href="../static/app/css/bootstrap.css" id="bscss">
   <!-- =============== APP STYLES ===============-->
   <link rel="stylesheet" href="../static/app/css/app.css" id="maincss">
</head>
<style>
        .fontpassword {
            position: relative;
        }
        
        .fontpassword i{
            position: absolute;
            right: 15px;
            top: 33px;
            font-size: x-large;
            color: gray;
        }
</style>
<body>   
    <header class="topnavbar-wrapper">
       <!-- START Top Navbar-->
       <nav role="navigation" class="navbar topnavbar">
          <!-- START navbar header-->
          <div class="navbar-header" style="left: 0;position: absolute;">
             <a href="/" class="navbar-brand">
                <div class="brand-logo">
                   Therapy Manager
                </div>
                <div class="brand-logo-collapsed">
                   <img src="img/logo-single.png" alt="App Logo" class="img-responsive">
                </div>
             </a>
          </div>
          <!-- END navbar header-->
       </nav>
       <!-- END Top Navbar-->
    </header>

    <div class="container mt-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('mail_settings') }}">
            <div class="mb-3">
                <label for="MAIL_SERVER" class="form-label">Mail Server</label>
                <input type="text" class="form-control" id="MAIL_SERVER" name="MAIL_SERVER" value="{{ settings['MAIL_SERVER'] }}">
            </div>
            <div class="mb-3">
                <label for="MAIL_PORT" class="form-label">Mail Port</label>
                <input type="text" class="form-control" id="MAIL_PORT" name="MAIL_PORT" value="{{ settings['MAIL_PORT'] }}">
            </div>
            <div class="mb-3">
                <label for="MAIL_USE_TLS" class="form-label">Use TLS</label>
                <select class="form-control" id="MAIL_USE_TLS" name="MAIL_USE_TLS">
                    <option value="True" {% if settings['MAIL_USE_TLS'] == "True" %}selected{% endif %}>True</option>
                    <option value="False" {% if settings['MAIL_USE_TLS'] == "False" %}selected{% endif %}>False</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="MAIL_USERNAME" class="form-label">Mail Username</label>
                <input type="text" class="form-control" id="MAIL_USERNAME" name="MAIL_USERNAME" value="{{ settings['MAIL_USERNAME'] }}">
            </div>
            <div class="mb-3">
                <div class="fontpassword"> 
                    <label for="MAIL_PASSWORD" class="form-label">Mail Password</label>                
                    <input type="password" class="form-control" id="MAIL_PASSWORD" name="MAIL_PASSWORD" value="{{ settings['MAIL_PASSWORD'] }}">                
                    <span onclick="togglepass()">
                    <i class="fa fa-eye-slash" aria-hidden="true"></i>
                </span>
                </div>
            
            </div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
    </div>
</body>
<script>
    function togglepass(){
            // toggle the type attribute
            const password = document.querySelector("#MAIL_PASSWORD");
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);
            var eye = document.getElementsByTagName("i")[0] 
            if (type ==="password"){
                eye.classList.remove('fa-eye');
                eye.classList.add("fa-eye-slash"); 
            }
            else{
                eye.classList.remove("fa-eye-slash");
                eye.classList.add('fa-eye');
               
            }
    }
</script>
</html>
